# 知曜后端 · 生产编排（阿里云 ECS 单机部署）
# ----------------------------------------------------------------------------
# 一台 ECS 上跑全栈：pgvector + redis + 后端(uvicorn) + celery worker。
# 用法：
#   1. 同目录放好 .env（见 .env.example，生产必配项见部署指南）
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. 健康检查：curl http://127.0.0.1:8000/health
# Nginx 在宿主机反代 127.0.0.1:8000 → 域名 HTTPS（见 deploy/nginx-zhiyao.conf）
# ----------------------------------------------------------------------------

# P1-7 · 容器日志轮转：json-file 驱动单文件 10m × 3 份上限（默认无上限 → 单机磁盘会被
# 日志撑爆，盘满后 pg 写失败全栈瘫）。所有服务共用此锚点。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhiyao_pg
    restart: unless-stopped
    logging: *default-logging
    # P0-6 · 内存上限：防止任一容器内存失控触发内核 OOM-killer 随机杀进程（常误杀 pg）。
    # 单容器超限只杀自己并 restart，保护其余进程。值为 2核4G 上的保守起点，
    # 上线后用 `docker stats` 实测调优（见 RELEASE_AND_DEPLOYMENT_SOP）。
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhiyao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产必须在 .env 设强密码}
      POSTGRES_DB: ${POSTGRES_DB:-zhiyao}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - zhiyao_pgdata:/var/lib/postgresql/data
    # 仅容器内网可达，不对公网暴露（安全组也别开 5432）
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhiyao} -d ${POSTGRES_DB:-zhiyao}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhiyao_redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # 不设 maxmemory 淘汰策略：redis 同时是 Celery broker，allkeys-lru 会驱逐在途任务键致丢任务。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zhiyao_redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiyao_backend
    restart: unless-stopped
    logging: *default-logging
    # 生发性上限（BGE-M3 + uvicorn 1 worker 正常 ~1.8G）；作运行时失控backstop，非紧贴峰值。
    mem_limit: 2g
    env_file: .env
    environment:
      # 容器内连服务用 compose 服务名，不是 localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zhiyao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhiyao}
      REDIS_URL: redis://redis:6379/0
      # Celery 用容器服务名 redis（.env.example 默认 localhost 在容器内连不上）
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # BGE-M3 模型缓存挂持久卷（避免每次重启重下 ~1.3GB）
      HF_HOME: /models/hf
      # 大陆从 HuggingFace 官方下载慢/不稳 → 用国内镜像（见指南）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      APP_ENV: production
      PORT: "8000"
    volumes:
      - zhiyao_hf:/models/hf        # 模型权重持久化
      - zhiyao_uploads:/app/uploads # 用户上传文件持久化
    # 只绑回环，由宿主机 Nginx 反代；不对公网直接暴露 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # P1-6 · 探就绪端点（真查 DB+Redis）；依赖不可用时 503 → urlopen 抛错 → 判 unhealthy
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiyao_celery
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1800m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zhiyao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhiyao}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      HF_HOME: /models/hf
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      APP_ENV: production
    # 覆盖 Dockerfile 的 CMD：起 celery worker（不跑迁移/不起 uvicorn）
    # P0-6 · concurrency=1：减少 BGE-M3 模型副本数（worker 进程各持一份），控内存。
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - zhiyao_hf:/models/hf
      - zhiyao_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # P0-7 · Celery Beat 调度器：生产此前完全缺失 → 12 个 beat_schedule 定时任务
  # （每日任务生成/FSRS 复习推送/打卡提醒/周复盘/episode 清理/卡死笔记恢复）全部永不触发，
  # 在用户侧静默失效。worker 只执行不调度，必须有独立 beat 进程派发。
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiyao_celery_beat
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zhiyao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhiyao}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      HF_HOME: /models/hf
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      APP_ENV: production
    # schedule 文件落持久卷，重启不重置 last-run-time（防重复触发）
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /beat/celerybeat-schedule
    volumes:
      - zhiyao_beat:/beat
    depends_on:
      redis:
        condition: service_healthy

volumes:
  zhiyao_pgdata:
    name: zhiyao_pgdata
  zhiyao_redisdata:
    name: zhiyao_redisdata
  zhiyao_hf:
    name: zhiyao_hf
  zhiyao_uploads:
    name: zhiyao_uploads
  zhiyao_beat:
    name: zhiyao_beat
