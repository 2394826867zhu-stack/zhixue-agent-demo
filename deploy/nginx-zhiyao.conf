# 知曜后端 · Nginx 反向代理（阿里云 ECS）
# ----------------------------------------------------------------------------
# 放到 /etc/nginx/conf.d/zhiyao.conf，把 api.zhiyao.app 换成你的真实域名，
# ssl_certificate 路径换成你的证书（阿里云免费 DV 证书 或 certbot）。
# 关键：/agent/chat、/guidance 是 SSE 流式 → 必须关 proxy_buffering + 长超时。
# ----------------------------------------------------------------------------

# HTTP：备案通过后做 80→443 跳转（备案审核期间阿里云可能要求 80 可访问，按需调整）
server {
    listen 80;
    server_name api.zhiyao.app;          # ← 换成你的 API 域名
    # 备案/证书就绪后启用强制 HTTPS：
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.zhiyao.app;          # ← 换成你的 API 域名

    # ── SSL 证书（二选一）──
    # A. 阿里云免费 DV 证书：控制台下载 Nginx 格式，上传到下面路径
    # B. certbot：/etc/letsencrypt/live/api.zhiyao.app/{fullchain,privkey}.pem
    ssl_certificate     /etc/nginx/ssl/api.zhiyao.app.pem;       # ← 换成你的证书
    ssl_certificate_key /etc/nginx/ssl/api.zhiyao.app.key;       # ← 换成你的私钥
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 文件上传 ≤20MB（知识库/图片），留余量
    client_max_body_size 25m;

    # ── 普通 API ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ── SSE 流式端点（AI 教学/对话/引导）：关 buffering + 长读超时 ──
    location ~ ^/v1/(agent/chat|guidance/.*/messages) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";       # 保持长连接
        proxy_buffering off;                  # SSE 必须关，否则流式被缓冲成一坨
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;              # LLM 长回答留足时间
        proxy_send_timeout 300s;
    }
}
