version: "3.9"

# pgvector/pgvector:pg17 — 取代 Windows 原生 Postgres 17 服务
# 同端口 5432 + 同 credentials → 应用配置无需改动
# 数据卷 zhiyao_pgdata 持久化挂在 docker volume

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zhiyao_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhiyao
      POSTGRES_PASSWORD: zhiyao_dev_password
      POSTGRES_DB: zhiyao
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - zhiyao_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyao -d zhiyao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # P0-10 · dev 卷独立命名，杜绝与生产 docker-compose.prod.yml 的 `zhiyao_pgdata` 撞名：
  # 在 ECS 上误跑默认 docker-compose.yml 时只会建空的 dev 卷，绝不挂载/污染生产数据卷。
  # 本地 dev 数据可由迁移随时重建，重命名导致的旧 dev 卷弃用可接受。
  zhiyao_pgdata_dev:
    name: zhiyao_pgdata_dev
